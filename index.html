<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Call with Rob</title>
<style>
  :root{
    --ink:#111418; --muted:#5b6572; --line:#e3e7ec; --card:#fff; --bg:#f6f7f9;
    --wa:#1faa53; --wa-dark:#178a43;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:400 18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
    padding:24px 18px 40px;
  }
  main{max-width:520px;margin:0 auto}
  h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 22px;font-size:17px}
  .primary{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--wa);color:#fff;text-decoration:none;
    font-weight:600;font-size:20px;padding:18px 20px;border-radius:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  .primary:active{background:var(--wa-dark)}
  .primary svg{width:24px;height:24px;flex:none}
  .or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px;margin:26px 0 18px}
  .or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 12px}
  .slots{display:grid;gap:10px}
  .slot{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;text-decoration:none;color:inherit;
  }
  .slot:active{background:#eef1f4}
  .slot .when{font-weight:600}
  .slot .tz{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-top:2px}
  .slot .go{color:var(--wa);font-weight:600;white-space:nowrap;font-size:16px}
  .cal{
    display:block;text-align:center;margin-top:14px;padding:16px;border-radius:14px;
    background:#111418;color:#fff;text-decoration:none;font-weight:600;font-size:18px;
  }
  footer{margin-top:30px;color:var(--muted);font-size:14px;text-align:center}
  .note{margin-top:14px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Call with Rob</h1>
  <p class="sub">Pick a time below and it opens a message to me. Send it and the time is yours.</p>

  <a class="primary" id="wa" href="#">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.06c-.24.68-1.42 1.31-1.96 1.36-.5.05-.98.23-3.3-.69-2.79-1.1-4.56-3.94-4.7-4.12-.14-.18-1.13-1.5-1.13-2.87 0-1.36.72-2.03.97-2.31.25-.28.55-.35.73-.35.18 0 .37 0 .53.01.17.01.4-.06.62.48.23.55.79 1.92.86 2.06.07.14.12.3.02.48-.1.18-.15.3-.29.46-.14.16-.3.36-.42.48-.14.14-.29.29-.12.57.17.28.75 1.24 1.61 2.01 1.11.99 2.04 1.3 2.32 1.44.28.14.44.12.6-.07.16-.19.69-.8.88-1.08.18-.28.37-.23.62-.14.25.09 1.6.75 1.87.89.28.14.46.21.53.32.07.11.07.64-.17 1.32z"/></svg>
    Message me on WhatsApp
  </a>

  <div class="or">or pick a time</div>

  <h2>Next few days</h2>
  <div class="slots" id="slots"></div>

  <a class="cal" id="cal" href="#" hidden>See my calendar</a>

  <p class="note" id="note">Times are Central (Chicago). If none of these work, just message me and we'll find one.</p>
  <footer>— Rob</footer>
</main>

<script>
(function(){
  // WhatsApp number: from the fleet bridge credential (me.id 19013189730).
  var PHONE = "19013189730";
  // Fill this in when the Google appointment schedule exists; the button appears by itself.
  var CALENDAR_URL = "";

  var TZ = "America/Chicago";
  var DAYS = 12;          // how far ahead to generate
  var MAX_SLOTS = 8;      // how many to show, one per day so the list reaches the weekend
  var HOURS = {           // local appointment windows
    0: [9,10,11],         // Sun
    1: [],
    2: [18,19,20],
    3: [18,19,20],
    4: [18,19,20],
    5: [18,19,20],
    6: [9,10,11]          // Sat
  };

  function parts(d){
    var f = new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
    return f.formatToParts(d).reduce(function(a,p){a[p.type]=p.value;return a;},{});
  }
  // Build a Date for a given local (Chicago) wall-clock time.
  function localDate(y,m,d,h){
    var guess = new Date(Date.UTC(y,m,d,h+5,0,0)); // CDT = UTC-5
    var back = new Date(guess.toLocaleString("en-US",{timeZone:TZ}));
    guess = new Date(guess.getTime() + (guess - back));
    return guess;
  }

  var slots = [];
  var now = new Date();
  for (var i=0;i<DAYS && slots.length<MAX_SLOTS;i++){
    var probe = new Date(now.getTime() + i*86400000);
    var pr = new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(probe)
              .reduce(function(a,p){a[p.type]=p.value;return a;},{});
    var dowName = pr.weekday;
    var dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(dowName);
    var hrs = HOURS[dow] || [];
    var startIdx = i % (hrs.length || 1);   // rotate the hour so 6pm/7pm/8pm all appear
    for (var k=0;k<hrs.length && slots.length<MAX_SLOTS;k++){
      var when = localDate(+pr.year, +pr.month-1, +pr.day, hrs[(startIdx+k)%hrs.length]);
      if (when.getTime() - now.getTime() < 3*3600*1000) continue; // skip anything <3h away
      slots.push(when);
      break;
    }
    if (slots.length >= MAX_SLOTS) break;
  }

  var wrap = document.getElementById("slots");
  var note = document.getElementById("note");

  function render(list){
    wrap.innerHTML = "";
    list.forEach(function(s){
      var a = document.createElement("a");
      a.className = "slot";
      a.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(s.msg);
      a.innerHTML = '<span class="when">' + s.label + '<span class="tz">' + s.time + " Central</span></span>" +
                    '<span class="go">Send →</span>';
      wrap.appendChild(a);
    });
  }

  function fallback(){
    var out = [];
    slots.forEach(function(d){
      var p = parts(d);
      var label = p.weekday + ", " + p.month + " " + p.day;
      var time = p.hour + ":" + p.minute + " " + p.dayPeriod.toLowerCase().replace("am","a.m.").replace("pm","p.m.");
      out.push({label:label, time:time, msg:"Hi Rob — can we talk " + label + " at " + time + " Central?"});
    });
    return out;
  }

  document.getElementById("wa").href = "https://wa.me/" + PHONE + "?text=" +
    encodeURIComponent("Hi Rob — can we talk?");

  if (CALENDAR_URL) {
    var c = document.getElementById("cal");
    c.href = CALENDAR_URL; c.hidden = false;
    note.textContent = "Times are Central (Chicago). Bookings confirm instantly and land on my calendar.";
  }

  // Live availability published hourly by Rob's calendar job. Falls back to the
  // standard windows if the file is missing or malformed — the page never goes empty.
  fetch("slots.json?ts=" + Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if (data && data.slots && data.slots.length) {
        render(data.slots);
        var when = data.generated_at ? new Date(data.generated_at) : null;
        var stamp = when ? when.toLocaleString("en-US",{timeZone:"America/Chicago",
            weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
        note.textContent = "These are real open times from my calendar" +
          (stamp ? ", updated " + stamp + " Central" : "") +
          ". Times are Central (Chicago). None work? Just message me.";
      } else {
        render(fallback());
      }
    })
    .catch(function(){ render(fallback()); });
})();
</script>
</body>
</html>
